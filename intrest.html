<!DOCTYPE html>
<html>
<head>
    <title>Simple Interest Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #667eea;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d3;
        }

        #result {
            margin-top: 20px;
            color: #667eea;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple Interest Calculator</h1>
        
        <input type="number" id="principal" placeholder="Principal">
        <input type="number" id="rate" placeholder="Rate (%)">
        <input type="number" id="time" placeholder="Time (Years)">
        
        <button onclick="calculate()">Calculate</button>
        
        <h2 id="result"></h2>
    </div>
    
    <script>
        function calculate() {
            let principal = parseFloat(document.getElementById('principal').value);
            let rate = parseFloat(document.getElementById('rate').value);
            let time = parseFloat(document.getElementById('time').value);
            
            if (!principal || !rate || !time) {
                document.getElementById('result').innerText = 'Fill all fields!';
                return;
            }
            
            let interest = (principal * rate * time) / 100;
            let total = principal + interest;
            
            document.getElementById('result').innerText = 
                `Interest: $${interest.toFixed(2)} | Total: $${total.toFixed(2)}`;
        }
    </script>
</body>
</html>
